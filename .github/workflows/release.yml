name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.8.0）'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 还原本地工具（vpk）
        run: dotnet tool restore

      - name: 构建（0 警告）
        run: dotnet build Launcher.slnx -warnaserror

      - name: 测试
        run: dotnet test Launcher.slnx --no-build

      - name: 解析版本
        id: ver
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $v = '${{ github.ref_name }}'.TrimStart('v')
          } else {
            $v = '${{ inputs.version }}'
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT

      - name: 打包（publish + integrity.json + vpk）
        shell: pwsh
        run: ./scripts/pack.ps1 -Version '${{ steps.ver.outputs.version }}' -Tag '${{ steps.ver.outputs.tag }}'

      - name: 校验 integrity.json ↔ 产物
        shell: pwsh
        run: ./scripts/verify-integrity.ps1 -PublishDir build/publish

      - name: 断言无 MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem build/releases -Filter '*.msi' -File
          if ($msi) { throw "禁止 MSI 产物：$($msi.Name -join ', ')" }

      - uses: actions/upload-artifact@v4
        with:
          name: lumen-release
          path: build/releases/*

      - name: 创建 GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = (Get-ChildItem build/releases -File).FullName
          gh release create '${{ steps.ver.outputs.tag }}' @assets `
            --title 'Lumen ${{ steps.ver.outputs.version }}' `
            --notes '自动构建；更新清单见 releases.win.json（SHA-256，未签名）。'
